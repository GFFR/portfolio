<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Leads · gram</title>
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #16161c;
      --line: #2a2a34;
      --text: #e8e6e3;
      --mute: #8b8792;
      --accent: #e8a85c;
      --ok: #7ec99a;
      --user: #7eb8da;
      --gram: #c9b8e8;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --sans: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--mute);
    }
    header h1 span { color: var(--accent); }
    .nav {
      display: flex;
      gap: 12px;
      font-family: var(--mono);
      font-size: 11px;
    }
    .nav a {
      color: var(--mute);
      text-decoration: none;
    }
    .nav a:hover, .nav a.is-active { color: var(--accent); }
    .meta { font-family: var(--mono); font-size: 11px; color: var(--mute); }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      min-height: calc(100vh - 53px);
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .detail { border-left: none; border-top: 1px solid var(--line); }
    }
    .list {
      border-right: 1px solid var(--line);
      overflow: auto;
      max-height: calc(100vh - 53px);
    }
    .list-empty {
      padding: 24px 20px;
      color: var(--mute);
      font-family: var(--mono);
      font-size: 12px;
    }
    .lead-item {
      display: block;
      width: 100%;
      margin: 0;
      padding: 14px 18px;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .lead-item:hover { background: #1c1c24; }
    .lead-item.is-active { background: #22222c; border-left: 2px solid var(--accent); }
    .lead-time {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--mute);
      margin-bottom: 4px;
    }
    .lead-intent {
      font-size: 13px;
      font-weight: 500;
    }
    .lead-sub {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: #2a3a2a;
      color: var(--ok);
    }
    .detail {
      overflow: auto;
      max-height: calc(100vh - 53px);
      padding: 20px 24px 40px;
    }
    .detail-empty {
      color: var(--mute);
      font-family: var(--mono);
      font-size: 12px;
      padding-top: 40px;
    }
    .detail-head {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .detail-head h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 500;
    }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--mute);
    }
    .fields {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .field {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 8px;
      font-size: 13px;
    }
    .field-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .summary {
      margin-bottom: 24px;
      padding: 14px 16px;
      border-left: 2px solid var(--accent);
      background: #1a1a22;
      font-size: 13px;
    }
    .exchange { margin-bottom: 20px; }
    .msg {
      margin-bottom: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .msg-role {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .msg.user .msg-role { color: var(--user); }
    .msg.gram .msg-role { color: var(--gram); }
    .msg-body { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    .error-banner {
      margin: 16px 20px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #5c3030;
      background: #2a1818;
      color: #ff9b8a;
      font-family: var(--mono);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span>gram</span> · leads</h1>
    <nav class="nav">
      <a href="/admin/leads" class="is-active">leads</a>
      <a href="/admin/logs">logs</a>
    </nav>
    <div class="meta" id="summary">loading…</div>
  </header>
  <div id="error" class="error-banner" hidden></div>
  <div class="layout">
    <aside class="list" id="list">
      <div class="list-empty">Loading leads…</div>
    </aside>
    <main class="detail" id="detail">
      <div class="detail-empty">Select a lead</div>
    </main>
  </div>
  <script>
    const listEl = document.getElementById('list');
    const detailEl = document.getElementById('detail');
    const summaryEl = document.getElementById('summary');
    const errorEl = document.getElementById('error');
    let activeId = null;

    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function showError(msg) {
      errorEl.hidden = false;
      errorEl.textContent = msg;
    }

    async function api(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(res.status === 401 ? 'Unauthorized' : `HTTP ${res.status}`);
      return res.json();
    }

    function contactPreview(fields) {
      if (!fields) return '—';
      return fields.email || fields.linkedin || fields.phone || fields.name || '—';
    }

    function renderList(leads) {
      summaryEl.textContent = `${leads.length} lead${leads.length === 1 ? '' : 's'}`;
      if (!leads.length) {
        listEl.innerHTML = '<div class="list-empty">No leads notified yet.</div>';
        return;
      }
      listEl.innerHTML = leads.map((l) => `
        <button type="button" class="lead-item${l.sessionId === activeId ? ' is-active' : ''}" data-id="${esc(l.sessionId)}">
          <div class="lead-time">${esc(fmt(l.notifiedAt || l.savedAt))}${l.notifiedAt ? '<span class="badge">sent</span>' : ''}</div>
          <div class="lead-intent">${esc(l.intentLabel || l.intent || 'Unknown')}</div>
          <div class="lead-sub">${esc(contactPreview(l.fields))}${l.summary ? ` · ${esc(l.summary)}` : ''}</div>
        </button>
      `).join('');

      listEl.querySelectorAll('.lead-item').forEach((btn) => {
        btn.addEventListener('click', () => loadLead(btn.dataset.id));
      });
    }

    function renderFields(fields) {
      const keys = ['name', 'email', 'linkedin', 'phone', 'company', 'role', 'timeline', 'timezone', 'message'];
      return keys
        .filter((k) => fields?.[k])
        .map((k) => `
          <div class="field">
            <div class="field-label">${esc(k)}</div>
            <div>${esc(fields[k])}</div>
          </div>
        `).join('');
    }

    function renderMessages(messages) {
      const pairs = [];
      for (let i = 0; i < messages.length; i++) {
        if (messages[i].role === 'user') {
          pairs.push({ user: messages[i], gram: messages[i + 1]?.role === 'assistant' ? messages[i + 1] : null });
        }
      }
      return pairs.map(({ user, gram }) => `
        <div class="exchange">
          <div class="msg user">
            <div class="msg-role">visitor</div>
            <div class="msg-body">${esc(user.content)}</div>
          </div>
          ${gram ? `
            <div class="msg gram">
              <div class="msg-role">gram</div>
              <div class="msg-body">${esc(gram.content)}</div>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function renderDetail(data) {
      const lead = data.lead || {};
      const fields = lead.fields || {};
      detailEl.innerHTML = `
        <div class="detail-head">
          <h2>${esc(lead.intentLabel || lead.intent || 'Lead')}</h2>
          <div class="detail-meta">
            <span>notified ${esc(fmt(lead.notifiedAt))}</span>
            <span>session ${esc(data.sessionId)}</span>
            ${data.ip ? `<span>ip ${esc(data.ip)}</span>` : ''}
            <span><a href="/admin/logs" style="color:var(--accent)">all logs</a></span>
          </div>
        </div>
        ${lead.summary ? `<div class="summary">${esc(lead.summary)}</div>` : ''}
        ${lead.intentDetail ? `<div class="summary" style="border-color:var(--mute)">Other: ${esc(lead.intentDetail)}</div>` : ''}
        <div class="fields">${renderFields(fields) || '<div class="field"><div class="field-label">—</div><div>No fields captured</div></div>'}</div>
        <h3 style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 12px">Conversation</h3>
        ${renderMessages(data.messages || [])}
      `;
    }

    async function loadLead(id) {
      activeId = id;
      try {
        const { leads } = await api('/api/admin/leads');
        renderList(leads);
        const data = await api(`/api/admin/leads/${encodeURIComponent(id)}`);
        renderDetail(data);
      } catch (err) {
        showError(err.message);
      }
    }

    async function init() {
      try {
        const { leads } = await api('/api/admin/leads');
        renderList(leads);
        if (leads.length) await loadLead(leads[0].sessionId);
      } catch (err) {
        listEl.innerHTML = '<div class="list-empty">Could not load leads.</div>';
        showError(err.message);
      }
    }

    init();
  </script>
</body>
</html>
